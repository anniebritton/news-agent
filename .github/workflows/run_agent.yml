# Template workflow. To run another agent, copy this file to run_<id>.yml and change
# the name, the AGENT value, and the secret names. Add secrets for whichever
# notify channels the agent config uses (e.g. SIGNAL_* instead of TELEGRAM_*).
name: News Agent (example_launches)

on:
  # Scheduled runs are off by default so a fresh copy of this template doesn't fail
  # before its secrets exist. Uncomment once the secrets are set.
  # schedule:
  #   - cron: '0 6,14,22 * * *'   # UTC. Each run that finds news commits the state file.
  workflow_dispatch:

permissions:
  contents: write

env:
  AGENT: example_launches

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -v
      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXAMPLE_LAUNCHES_TELEGRAM_BOT_TOKEN: ${{ secrets.EXAMPLE_LAUNCHES_TELEGRAM_BOT_TOKEN }}
          EXAMPLE_LAUNCHES_TELEGRAM_CHAT_ID: ${{ secrets.EXAMPLE_LAUNCHES_TELEGRAM_CHAT_ID }}
        run: python main.py --agent "$AGENT"
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || (git commit -m "chore: update $AGENT state [skip ci]" && git push)
